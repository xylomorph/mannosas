project:
  type: book
  output-dir: ../docs
  pre-render: ../scripts/pre-render.sh
  post-render:
    - ../scripts/post-render.sh
    - bash ../scripts/post-render-thumbnail.sh
  resources:
    - ../.nojekyll

# Profile group: html is the default (quarto render / quarto preview)
# For PDF use: quarto render --profile pdf --to pdf
profile:
  group:
    - [html, pdf]

book:
  title: "Analysing Argumentation Structures"
  subtitle: "A Minimalistic Annotation Scheme for Argumentation Structures (v1.0)"
  description: "These guidelines provide clarifications, maxims and hints that will help annotators to analyse the argumentation structure in argumentative texts."
  author: 
    - name: Sebastian Cacean
  date: 2026-09-11
  version: v1.0
  doi: 10.5281/zenodo.22709968
  downloads: [pdf, docx]
  sharing: [twitter, linkedin]
  site-url: https://sebastiancacean.de/mannosas/
  repo-url: https://github.com/xylomorph/mannosas/
  license: "CC BY 4.0"
  keyword: "argument analysis, argument mapping, content analysis, argument annotation, argument mining, argumentation"
  # chapters are defined per-profile in _quarto-html.yml and _quarto-pdf.yml
  twitter-card:
    image: figures/featured.png
  open-graph:
    image: figures/featured.png


citation: 
  type: report
  url: https://sebastiancacean.de/mannosas/
  doi: 10.5281/zenodo.22709968
  title: "Analysing Argumentation Structures - A Minimalistic Annotation Scheme."
  author: "Sebastian Cacean"
  issued: "2026-09-11"
  number: "v1.0"
  abstract: |
    These guidelines provide clarifications, maxims and hints that will help annotators to analyse the argumentation structure in argumentative texts.


google-scholar: true

bibliography: references.bib
reference-section-title: "Literature"


format:
  html:
    theme: cosmo
    css: styles.css
    toc-depth: 4
    link-external-newwindow: true
    google-scholar: true
    
  pdf:
    documentclass: scrreprt
    pdf-engine: pdflatex
    header-includes:
      - \usepackage{geometry}
      - \usepackage{afterpage}
      - \usepackage{xcolor}
      - \usepackage{lmodern}
      - \usepackage{fix-cm}
      - \usepackage{tikz}
      - \usetikzlibrary{fadings}
      - \usepackage{pdfpages}
      - \AtBeginDocument{\renewcommand{\maketitle}{}} # we use a dedicated `front_page.pdf` as front
      - \AtBeginDocument{\tikzfading[name=softnorthfade, bottom color=transparent!0, top color=transparent!85]}
      - \usepackage{hyperref}
      - \hypersetup{breaklinks=true, colorlinks=true, urlcolor=blue}
      # tcolorbox (used for callouts) resets \parindent and \parskip to 0pt internally.
      # Restore them via the `before upper` hook so that paragraph spacing inside callouts
      # matches the main text (parskip=half) and \vspace{\parskip} works as expected.
      - \AtBeginDocument{\tcbset{before upper={\setlength{\parindent}{0pt}\setlength{\parskip}{0.5\baselineskip}}}}
    include-before-body:
      - tex/frontpage.tex
      - tex/copyrightpage.tex
  docx:
    toc: true
    number-sections: true
    highlight-style: github  

crossref:
  custom:
    - kind: float
      reference-prefix: Example
      key: example
      latex-env: example
    - kind: float
      reference-prefix: Clarification
      key: clarification
      latex-env: clarification

tbl-cap-location: bottom


